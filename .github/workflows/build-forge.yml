name: Build Archaion Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap Forge 47.4.20 Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          MDK_URL="https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.20/forge-1.20.1-47.4.20-mdk.zip"
          MDK_SHA1="ae89b7adec05802fb805c9345b509029c6952ebb"
          curl --fail --location --retry 3 --output forge-mdk.zip "$MDK_URL"
          echo "$MDK_SHA1  forge-mdk.zip" | sha1sum --check --strict
          rm -rf .forge-mdk
          mkdir .forge-mdk
          unzip -q forge-mdk.zip -d .forge-mdk
          cp -a .forge-mdk/gradle ./gradle
          cp .forge-mdk/gradlew ./gradlew
          cp .forge-mdk/gradlew.bat ./gradlew.bat
          chmod +x ./gradlew

      - name: Build with ForgeGradle
        shell: bash
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Show produced jars
        if: always()
        shell: bash
        run: find build/libs -maxdepth 1 -type f -name '*.jar' -print 2>/dev/null || true

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Archaion-Forge-1.20.1-test-build
          path: build/libs/*.jar
          if-no-files-found: error
